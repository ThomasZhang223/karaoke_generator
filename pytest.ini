[pytest]
markers =
    smoke: quick checks covering core happy paths
    regression: thorough tests covering error handling and fallbacks
    integration: tests that require system ffmpeg binary
    e2e: end-to-end tests covering complete pipeline
    performance: performance benchmarks and timing tests
    slow: tests that may take longer to execute
addopts = --cov=backend --cov-report=term-missing --cov-report=html --cov-report=xml
